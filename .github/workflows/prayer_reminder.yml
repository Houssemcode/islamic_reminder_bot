name: Automated Salah & Azkar Reminder

on:
  schedule:
    # Runs every 15 minutes, 24/7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Lets you test the bot with 1 click

jobs:
  check_prayers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests tzdata

      - name: Run Salah & Azkar Notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python notifier.py
