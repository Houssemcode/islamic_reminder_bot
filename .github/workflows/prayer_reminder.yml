name: Automated Salah & Azkar Reminder

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check_prayers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore today's sent alerts cache
        uses: actions/cache@v4
        with:
          path: .sent_alerts.json
          key: alerts-state-${{ github.run_id }}
          restore-keys: |
            alerts-state-

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run Salah & Azkar Notifier
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python notifier.py
